<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoenensMedia — Portaal</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login-view">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-brand-row">
        <img src="assets/logo.png" alt="SoenensMedia">
        <span class="brand-name">SoenensMedia</span>
      </div>
      <div class="brand-sub">Portaal</div>
    </div>
    <form id="login-form">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Wachtwoord</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-red" style="width:100%" id="login-submit">Inloggen</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app-shell" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <img src="assets/logo.png" alt="SoenensMedia">
      <span class="brand-name">SoenensMedia</span>
    </div>
    <div class="tabs">
      <button class="tab-btn" data-view="dashboard">Dashboard</button>
      <button class="tab-btn" data-view="agenda">Agenda</button>
      <button class="tab-btn" data-view="deadlines">Deadlines</button>
      <button class="tab-btn" data-view="uren">Uren</button>
      <button class="tab-btn" data-view="clients">Klanten</button>
      <button class="tab-btn" data-view="finance">Financiën</button>
      <button class="tab-btn" data-view="scripting">Scripting</button>
      <button class="tab-btn" data-view="content">Content</button>
      <button class="tab-btn" data-view="equipment">Equipment</button>
    </div>
    <button class="btn btn-ghost btn-small" id="logout-btn">Uitloggen</button>
  </div>

  <main>
    <!-- DASHBOARD -->
    <section id="view-dashboard" class="view">
      <div class="view-header">
        <h1>Dashboard</h1>
        <button class="btn btn-red" id="new-project-btn">+ Opdracht</button>
      </div>
      <div class="kanban" id="kanban-container"></div>
    </section>

    <!-- AGENDA -->
    <section id="view-agenda" class="view hidden">
      <div class="view-header">
        <h1>Agenda</h1>
        <div class="week-nav">
          <button class="btn btn-ghost btn-small" id="prev-week-btn">‹</button>
          <span class="week-label" id="week-label"></span>
          <button class="btn btn-ghost btn-small" id="next-week-btn">›</button>
          <button class="btn btn-ghost btn-small" id="today-btn">Deze week</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="week-grid" id="week-grid"></div>
    </section>

    <!-- UREN -->
    <section id="view-uren" class="view hidden">
      <div class="view-header">
        <h1>Uren</h1>
        <button class="btn btn-red" id="new-time-entry-btn">+ Uren loggen</button>
      </div>
      <div class="stats-row" id="uren-stats"></div>
      <table class="log-table">
        <thead>
          <tr><th>Datum</th><th>Project</th><th>Uren</th><th>Omschrijving</th><th></th></tr>
        </thead>
        <tbody id="uren-table-body"></tbody>
      </table>
    </section>

    <!-- DEADLINES -->
    <section id="view-deadlines" class="view hidden">
      <div class="view-header">
        <h1>Deadlines</h1>
      </div>
      <div id="deadlines-container"></div>
    </section>

    <!-- KLANTEN -->
    <section id="view-clients" class="view hidden">
      <div class="view-header">
        <h1>Klanten</h1>
        <button class="btn btn-red" id="new-client-btn">+ Klant toevoegen</button>
      </div>
      <div id="clients-container"></div>
    </section>

    <!-- FINANCIËN -->
    <section id="view-finance" class="view hidden">
      <div class="view-header">
        <h1>Financiën</h1>
      </div>
      <div id="finance-container"></div>
    </section>

    <!-- SCRIPTING -->
    <section id="view-scripting" class="view hidden">
      <div class="view-header">
        <h1>Scripting</h1>
        <button class="btn btn-red" id="scripting-add-btn">+ Idee/script toevoegen</button>
      </div>
      <div class="field" id="scripting-project-field">
        <label>Opdracht</label>
        <select id="scripting-project-select"></select>
      </div>
      <div id="scripting-container"></div>
    </section>

    <!-- CONTENT PLANNING -->
    <section id="view-content" class="view hidden">
      <div class="view-header">
        <h1>Content</h1>
      </div>
      <div id="content-container"></div>
    </section>

    <!-- EQUIPMENT -->
    <section id="view-equipment" class="view hidden">
      <div class="view-header">
        <h1>Equipment</h1>
        <button class="btn btn-red" id="new-equipment-btn">+ Toevoegen</button>
      </div>
      <div id="equipment-container"></div>
    </section>
  </main>
</div>

<!-- ══════════ KLANT ══════════ -->
<div id="client-shell" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <img src="assets/logo.png" alt="SoenensMedia">
      <span class="brand-name">SoenensMedia</span>
    </div>
    <button class="btn btn-ghost btn-small" id="client-logout-btn">Uitloggen</button>
  </div>

  <main>
    <div class="view-header">
      <h1>Mijn projecten</h1>
    </div>
    <div id="client-projects-container"></div>
  </main>
</div>

<!-- Modal container: JS injects modals here -->
<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
